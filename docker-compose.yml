# Arr stack + Plex on Raspberry Pi 5
# Services behind the VPN route through gluetun (kill-switched).
# Plex, Overseerr and Tautulli stay on the regular network.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080       # qBittorrent web UI
      - 6881:6881       # qBittorrent torrenting
      - 6881:6881/udp
      - 8989:8989       # Sonarr
      - 7878:7878       # Radarr
      - 9696:9696       # Prowlarr
      - 6767:6767       # Bazarr
      - 5656:5656       # Unpackerr
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - TZ=${TZ}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/immich_data/media/downloads:/downloads
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      # single parent mount so *arr can hardlink imports (no extra disk use)
      - /mnt/immich_data/media:/media
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      # single parent mount so *arr can hardlink imports (no extra disk use)
      - /mnt/immich_data/media:/media
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - /mnt/immich_data/media/tv:/tv
      - /mnt/immich_data/media/movies:/movies
    restart: unless-stopped

  unpackerr:
    image: ghcr.io/hotio/unpackerr:release
    container_name: unpackerr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UN_FOLDER_0_PATH=/downloads
      - UN_FOLDER_0_MOVE_BACK=true
      - UN_FOLDER_0_DELETE_ORIGINAL=false
      - UN_INTERVAL=2m
      # Add *arr API keys later for direct integration, e.g.:
      # - UN_SONARR_0_URL=http://localhost:8989
      # - UN_SONARR_0_API_KEY=
      # - UN_RADARR_0_URL=http://localhost:7878
      # - UN_RADARR_0_API_KEY=
    volumes:
      - ./config/unpackerr:/config
      - /mnt/immich_data/media/downloads:/downloads
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    ports:
      - 32400:32400
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./config/plex:/config
      - /mnt/immich_data/media/tv:/tv
      - /mnt/immich_data/media/movies:/movies
    restart: unless-stopped

  overseerr:
    image: sctx/overseerr:latest
    container_name: overseerr
    ports:
      - 5055:5055
    environment:
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ./config/overseerr:/app/config
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    ports:
      - 8181:8181
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/tautulli:/config
    restart: unless-stopped

  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    ports:
      - "${TAILSCALE_IP}:8082:80"
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - ./config/filebrowser-quantum/data:/home/filebrowser/data
      - /mnt/immich_data:/data
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    hostname: homepage
    ports:
      - "${TAILSCALE_IP}:3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=${TAILSCALE_IP}:3000
    volumes:
      - ./config/homepage:/app/config
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "${TAILSCALE_IP}:3001:3001"
    volumes:
      - ./config/uptime-kuma:/app/data
    restart: unless-stopped

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    ports:
      - "${TAILSCALE_IP}:8090:8090"
    environment:
      - APP_URL=http://${TAILSCALE_IP}:8090
    volumes:
      - ./config/beszel:/beszel_data
      - ./config/beszel_socket:/beszel_socket
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    volumes:
      - ./config/beszel_agent_data:/var/lib/beszel-agent
      - ./config/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - TOKEN=${BESZEL_TOKEN}
      - KEY=${BESZEL_KEY}
    restart: unless-stopped
